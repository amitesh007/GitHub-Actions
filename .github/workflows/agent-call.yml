# Agent Call — Lending API Developer
#
# Manual workflow that:
#   1. Accepts a branch name, Excel specification file path, and entity name
#   2. Checks out the specified branch
#   3. Invokes the lending-api-developer agent with the standard prompt:
#      @lending-api-developer generate Create, Update, Query, and Delete APIs
#      for [EntityName] using file path [ExcelFilePath]
#   4. Uploads generated artifacts: temp classes, Review.md, usage-agent.md
#
# Prerequisites:
#   - ANTHROPIC_API_KEY must be set as a repository secret
#   - The requirement spreadsheet must already be committed to the target branch

name: Agent Call — Lending API Developer

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Branch to run the agent on (e.g. feature/my-api-branch)"
        required: true
        type: string
      excel_file_path:
        description: "Repo-relative path to the Excel specification (e.g. LoanIQ/Customer_API_v1.xlsx)"
        required: true
        type: string
      entity_name:
        description: "Business object / entity name (e.g. Customer, Deal, Facility)"
        required: true
        type: string

concurrency:
  group: agent-call-${{ github.event.inputs.branch_name }}-${{ github.event.inputs.entity_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  run-lending-api-agent:
    name: "Generate ${{ inputs.entity_name }} APIs on branch: ${{ inputs.branch_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─────────────────────────────────────────────────────────────────────────
      # 1. Checkout the user-specified branch
      # ─────────────────────────────────────────────────────────────────────────
      - name: Checkout repository on specified branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────────
      # 2. Set up Java (required by IntegrationAPITool JAR)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # ─────────────────────────────────────────────────────────────────────────
      # 3. Validate inputs
      # ─────────────────────────────────────────────────────────────────────────
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ inputs.branch_name }}"
          EXCEL_PATH="${{ inputs.excel_file_path }}"
          ENTITY="${{ inputs.entity_name }}"

          # Entity name: must start with a letter, alphanumeric + underscores only
          if [[ ! "${ENTITY}" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]; then
            echo "::error::entity_name must start with a letter and contain only alphanumeric characters or underscores. Got: '${ENTITY}'"
            exit 1
          fi

          # Guard against path traversal
          if [[ "${EXCEL_PATH}" == *".."* ]]; then
            echo "::error::Path traversal detected in excel_file_path. Got: '${EXCEL_PATH}'"
            exit 1
          fi

          # Must end in .xlsx or .xls
          if [[ ! "${EXCEL_PATH}" =~ \.(xlsx|xls)$ ]]; then
            echo "::error::excel_file_path must end with .xlsx or .xls. Got: '${EXCEL_PATH}'"
            exit 1
          fi

          # File must exist on the checked-out branch
          if [ ! -f "${EXCEL_PATH}" ]; then
            echo "::error::Spreadsheet not found at '${EXCEL_PATH}' on branch '${BRANCH}'."
            echo ""
            echo "Excel files available in LoanIQ/:"
            find LoanIQ -maxdepth 2 \( -name "*.xlsx" -o -name "*.xls" \) 2>/dev/null \
              | sort | sed 's/^/  - /' \
              || echo "  (none found)"
            exit 1
          fi

          # Agent file must exist
          if [ ! -f ".github/agents/lending-api-developer.agent.md" ]; then
            echo "::error::Agent file not found: .github/agents/lending-api-developer.agent.md"
            exit 1
          fi

          echo "✅ Branch:       ${BRANCH}"
          echo "✅ Entity name:  ${ENTITY}"
          echo "✅ Excel path:   ${EXCEL_PATH}"
          echo "✅ Agent file:   .github/agents/lending-api-developer.agent.md"

      # ─────────────────────────────────────────────────────────────────────────
      # 4. Confirm GitHub Copilot access (no separate API key required)
      #    GITHUB_TOKEN is automatically available in every Actions run.
      #    Requires: GitHub Copilot subscription on the organisation/user.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Confirm GitHub Copilot access
        shell: bash
        run: |
          echo "✅ Using GITHUB_TOKEN for GitHub Models / Copilot API."
          echo "   No separate ANTHROPIC_API_KEY is required."
          echo "   Model: gpt-4o (via GitHub Models — https://models.inference.ai.azure.com)"
          echo "   Note: GitHub Models serves OpenAI GPT-4o, not Claude."
          echo "         To keep using Claude, set ANTHROPIC_API_KEY and revert to claude-code-action."

      # ─────────────────────────────────────────────────────────────────────────
      # 5a. Generate baseline API classes via PowerShell script
      #     Runs run-excel-reader.ps1 which the claude-code-action agent used to
      #     invoke as its first agentic step (Step 1 of lending-api-developer).
      # ─────────────────────────────────────────────────────────────────────────
      - name: Generate baseline API classes
        shell: pwsh
        run: |
          .github/skills/lending-rest-excel-reader/scripts/run-excel-reader.ps1 "${{ inputs.excel_file_path }}"

      # ─────────────────────────────────────────────────────────────────────────
      # 5b. Invoke lending-api-developer agent via GitHub Copilot / GitHub Models
      #     Uses GITHUB_TOKEN (models: read permission) — no ANTHROPIC_API_KEY.
      #     Sends the full .agent.md as the system prompt so all 11 workflow
      #     steps and SKILL.md rules are included as instructions.
      #
      #     ⚠️  LIMITATION vs claude-code-action:
      #     claude-code-action runs as a fully autonomous agent (reads files,
      #     executes commands, writes files). This step is a chat-completion call
      #     — it returns enhancement guidance that is written to copilot-output.md
      #     and applied by the git commit step below. Complex multi-file edits may
      #     require a developer to apply copilot-output.md manually.
      # ─────────────────────────────────────────────────────────────────────────
      - name: "Invoke lending-api-developer agent via GitHub Copilot"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          AGENT_INSTRUCTIONS=$(cat .github/agents/lending-api-developer.agent.md)
          USER_PROMPT="Generate Create, Update, Query, and Delete APIs for ${{ inputs.entity_name }} using file path ${{ inputs.excel_file_path }}. Apply all SKILL.md patterns (Steps 4-10), fix all TODOs, add complete imports, produce production-ready code with ZERO stubs, and copy non-conflicting files to the repository. Generate Review.md on completion."

          PAYLOAD=$(jq -n \
            --arg sys "$AGENT_INSTRUCTIONS" \
            --arg usr "$USER_PROMPT" \
            '{
              model: "gpt-4o",
              messages: [
                {role: "system", content: $sys},
                {role: "user",   content: $usr}
              ],
              max_tokens: 16384
            }')

          HTTP_CODE=$(curl -s -o copilot-output.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            "https://models.inference.ai.azure.com/chat/completions" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::GitHub Models API returned HTTP ${HTTP_CODE}. Check your Copilot subscription and models: read permission."
            cat copilot-output.json
            exit 1
          fi

          jq -r '.choices[0].message.content' copilot-output.json > copilot-output.md

          echo "════════════════════════════════════════════════════════════════"
          echo "  GitHub Copilot Agent Output"
          echo "════════════════════════════════════════════════════════════════"
          cat copilot-output.md
          echo "════════════════════════════════════════════════════════════════"

      # ─────────────────────────────────────────────────────────────────────────
      # 6. Load and display Review.md
      # ─────────────────────────────────────────────────────────────────────────
      - name: Load Review.md
        id: load-review
        shell: bash
        run: |
          REVIEW_PATH="FLIQ-liqjava/Review.md"
          if [ ! -f "${REVIEW_PATH}" ]; then
            REVIEW_PATH="Review.md"
          fi

          if [ -f "${REVIEW_PATH}" ]; then
            echo "review_found=true"  >> "$GITHUB_OUTPUT"
            echo "review_path=${REVIEW_PATH}" >> "$GITHUB_OUTPUT"
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  Review.md — ${REVIEW_PATH}"
            echo "════════════════════════════════════════════════════════════════"
            cat "${REVIEW_PATH}"
            echo "════════════════════════════════════════════════════════════════"
          else
            echo "review_found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Review.md was not found at 'FLIQ-liqjava/Review.md' or 'Review.md'."
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # 7. Commit and push generated files
      # ─────────────────────────────────────────────────────────────────────────
      - name: Configure git identity
        shell: bash
        run: |
          git config user.name  "agent-call[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage all generated and modified files
        id: stage
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No file changes were staged after agent execution. Nothing to commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Staged files:"
            git diff --cached --name-only | sed 's/^/  /'
          fi

      - name: Commit generated API classes
        if: steps.stage.outputs.has_changes == 'true'
        shell: bash
        run: |
          git commit -m "feat: Add ${{ inputs.entity_name }} REST API integration classes (agent-call)

          Generated by lending-api-developer agent via agent-call workflow.

          - Entity:      ${{ inputs.entity_name }}
          - Spreadsheet: ${{ inputs.excel_file_path }}
          - Branch:      ${{ inputs.branch_name }}
          - Run:         ${{ github.run_id }}
          - Actor:       ${{ github.actor }}"

      - name: Push to target branch
        if: steps.stage.outputs.has_changes == 'true'
        shell: bash
        run: |
          git push origin HEAD:"${{ inputs.branch_name }}"

      # ─────────────────────────────────────────────────────────────────────────
      # 8. Upload artifacts (always, even on failure)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Upload generated output as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-call-${{ inputs.entity_name }}-run${{ github.run_number }}
          path: |
            IntegrationAPITool/artifacts/temp_generated_class/
            FLIQ-liqjava/Review.md
            Review.md
            FLIQ-liqjava/usage-agent.md
            usage-agent.md
            copilot-output.md
            copilot-output.json
          retention-days: 14
          if-no-files-found: ignore
